<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语小冒险 · 小学英语闯关乐园</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="%23FFC93C"/><path d="M32 11l6.2 13.4 14.8 1.9-10.7 10.5 2.5 14.6L32 44.6 19.2 51.4l2.5-14.6L11 26.3l14.8-1.9z" fill="%2322314D"/></svg>'>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --ink:#22314D;
  --ink-soft:#61708A;
  --ink-faint:rgba(34,49,77,.26);
  --paper:#FFF6E5;
  --card:#FFFDF6;
  --orange:#FF8A3D;
  --orange-deep:#B8551B;
  --yellow:#FFC93C;
  --teal:#2FBFA8;
  --sky:#59C6EA;
  --pink:#FF8FA8;
  --purple:#9C8BF2;
  --green:#7ECD6B;
  --red:#E4573D;
  --shadow:0 6px 0 rgba(34,49,77,.13);
  --shadow-lg:0 12px 0 rgba(34,49,77,.12);
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-en:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);
  background-color:var(--paper);
  background-image:radial-gradient(circle at center,rgba(34,49,77,.075) 1px,transparent 1.3px);
  background-size:20px 20px;
}
img,svg{display:block}
button{font-family:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit}
ul,ol{list-style:none;margin:0;padding:0}

/* ---------- 基础 ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:20px clamp(14px,3vw,34px) 70px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:700;line-height:1.2;color:var(--ink);
  padding:13px 22px;border:2px solid var(--ink);border-radius:999px;
  background:var(--card);box-shadow:0 4px 0 var(--ink);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  text-decoration:none;
}
.btn:hover{background:#FFF6D6}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn.primary{background:var(--yellow)}
.btn.primary:hover{background:#FFD866}
.btn.ghost{box-shadow:0 4px 0 rgba(34,49,77,.18);border-color:var(--ink-faint)}
.btn.sm{font-size:14px;padding:9px 16px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:0 3px 0 rgba(34,49,77,.2)}
.iconbtn{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  border:2px solid var(--ink);border-radius:50%;background:var(--card);
  box-shadow:0 3px 0 rgba(34,49,77,.2);cursor:pointer;color:var(--ink);
  transition:transform .12s ease,box-shadow .12s ease;
  padding:0;
}
.iconbtn:hover{background:#FFF3CE}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(34,49,77,.2)}
.iconbtn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.icon-svg{width:22px;height:22px}
.star-row{display:inline-flex;gap:3px;align-items:center}
.star{width:15px;height:15px;flex:none}
.star.on{color:var(--yellow)}
.star.off{color:rgba(34,49,77,.2)}
.coinpill{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font-en);
  font-weight:700;font-size:14px;background:var(--card);border:2px solid var(--ink);
  border-radius:999px;padding:6px 12px;white-space:nowrap;
}
.coinpill .icon-svg{width:18px;height:18px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,246,229,.95);
  border-bottom:2px dashed rgba(34,49,77,.22);
}
.topbar-in{
  max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:9px clamp(14px,3vw,34px);padding-right:70px;min-height:64px;
}
.bar-copy{min-width:0;flex:1}
.bar-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.bar-spacer{flex:1}
.dots{display:flex;gap:6px;align-items:center}
.qdot{width:9px;height:9px;border-radius:50%;background:rgba(34,49,77,.16);transition:background .2s}
.qdot.now{background:var(--orange);transform:scale(1.35)}
.qdot.ok{background:var(--green)}
.sound-toggle{
  position:fixed;top:10px;right:14px;z-index:40;
  width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);
  background:var(--card);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 0 rgba(34,49,77,.2);color:var(--ink);
}
.sound-toggle[aria-checked="false"]{background:#FFE9E4;color:var(--ink-soft)}
.sound-toggle:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.sound-toggle .icon-svg{width:20px;height:20px}

/* ---------- 首页 ---------- */
.hero{
  position:relative;display:grid;grid-template-columns:1.12fr .88fr;gap:20px;
  align-items:center;background:var(--card);border:2px solid var(--ink);
  border-radius:34px;padding:clamp(22px,3.4vw,42px);box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.hero::before{
  content:"ABC";position:absolute;right:-10px;top:-26px;
  font-family:var(--font-en);font-weight:800;font-size:150px;line-height:1;
  color:rgba(34,49,77,.05);letter-spacing:-.03em;pointer-events:none;
}
.kicker{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-en);
  font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--orange-deep);
  background:#FFF0DC;border:2px solid var(--orange);border-radius:999px;padding:5px 13px;
}
.title{
  font-size:clamp(40px,6.4vw,72px);line-height:1.05;font-weight:900;
  letter-spacing:.01em;margin:16px 0 14px;
}
.title .t1{position:relative;display:inline-block;z-index:1}
.title .t1::after{
  content:"";position:absolute;left:-4px;right:-4px;bottom:6px;height:20px;
  background:rgba(255,201,60,.75);border-radius:8px;z-index:-1;transform:rotate(-1.5deg);
}
.title .t2{color:var(--orange)}
.lede{font-size:15px;line-height:1.75;color:var(--ink-soft);max-width:34em}
.lede b{color:var(--ink)}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:26px}
.hero-note{font-size:12px;color:var(--ink-soft);line-height:1.6}
.hero-art{position:relative;height:330px;min-width:0}
.hero-art .mascot{position:absolute;left:50%;bottom:14px;width:210px;transform:translateX(-58%)}
.art-book{
  position:absolute;left:50%;bottom:0;width:280px;height:58px;transform:translateX(-50%) rotate(-3deg);
  border:2px solid var(--ink);border-radius:12px;background:var(--orange);
  box-shadow:0 6px 0 rgba(34,49,77,.18);
}
.art-book::before{
  content:"";position:absolute;inset:7px 9px auto 9px;height:6px;border-radius:4px;background:rgba(255,255,255,.55);
}
.art-cloud{position:absolute;background:#fff;border:2px solid rgba(34,49,77,.18);border-radius:999px;opacity:.9}
.tile{
  position:absolute;width:62px;height:62px;border:2px solid var(--ink);border-radius:16px;
  background:var(--card);display:grid;place-items:center;
  font-family:var(--font-en);font-weight:800;font-size:30px;box-shadow:0 5px 0 rgba(34,49,77,.15);
}
.tile.a{background:#FFE6D2;color:var(--orange);left:6%;top:24px;transform:rotate(-9deg)}
.tile.b{background:#E3F6E1;color:#3E8B3A;right:12%;top:8px;transform:rotate(7deg)}
.tile.c{background:#E5F1FF;color:#2A6FB0;right:2%;bottom:96px;transform:rotate(-5deg)}
.spark{position:absolute;color:var(--yellow)}
.hero-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;font-size:12px;color:var(--ink-soft)}

.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin:40px 0 16px}
.sec-head h2{font-size:26px;letter-spacing:.01em}
.sec-head p{font-size:13px;color:var(--ink-soft)}
.grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gcard{
  position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;
  padding:18px 18px 16px;border:2px solid var(--ink);border-radius:22px;
  background:var(--bg);box-shadow:var(--shadow);cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease;
  transform:rotate(var(--tilt,0deg));
}
.gcard:hover{transform:rotate(0deg) translateY(-5px);box-shadow:0 10px 0 rgba(34,49,77,.14)}
.gcard:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.gcard .g-top{display:flex;align-items:center;gap:11px;min-width:0}
.gbadge{
  width:48px;height:48px;flex:none;border-radius:14px;border:2px solid var(--ink);
  background:var(--c);display:grid;place-items:center;color:var(--ink);
}
.gbadge .icon-svg{width:26px;height:26px}
.gname{font-size:21px;font-weight:900;line-height:1.15}
.gtag{font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.gblurb{font-size:13px;line-height:1.6;color:var(--ink-soft);min-height:2.6em}.gprog{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;padding-top:10px;border-top:1.5px dashed rgba(34,49,77,.18)}
.gprog span{font-size:12px;color:var(--ink-soft);font-weight:500}
.gprog b{font-family:var(--font-en);font-size:14px}
.ginfo{min-width:0}
.gname,.gtag,.gblurb{display:block}
.foot-links{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mascot svg,.mascot img{width:100%;height:auto;display:block}
.spark{color:var(--yellow)}
.spark .icon-svg{width:18px;height:18px}
.page-foot{margin-top:36px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-soft)}
.page-foot button{background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}

/* ---------- 地图 ---------- */
.maphead{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--card);border:2px solid var(--ink);border-radius:26px;
  padding:18px 22px;box-shadow:var(--shadow);
}
.mb-badge{width:64px;height:64px;flex:none;border-radius:18px;border:2px solid var(--ink);background:var(--c);display:grid;place-items:center}
.mb-badge .icon-svg{width:34px;height:34px}
.mb-text{min-width:0;flex:1}
.mb-name{font-size:26px;font-weight:900;line-height:1.15}
.mb-tag{font-size:12px;color:var(--ink-soft);margin-top:3px}
.mb-stars{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:12px;color:var(--ink-soft)}
.trail{max-width:780px;margin:26px auto 0;position:relative;padding-left:0}
.trail::before{content:"";position:absolute;left:36px;top:30px;bottom:34px;width:0;border-left:3px dashed rgba(34,49,77,.26)}
.stop{display:flex;gap:16px;align-items:flex-start;margin-bottom:24px;position:relative}
.node{
  width:74px;height:74px;flex:none;border-radius:50%;border:3px solid var(--ink);
  background:var(--card);display:grid;place-items:center;position:relative;z-index:1;
  box-shadow:var(--shadow);color:var(--ink);
}
.node .icon-svg{width:36px;height:36px}
.node .num{
  position:absolute;right:-6px;bottom:-6px;min-width:26px;height:26px;padding:0 5px;
  border-radius:999px;border:2px solid var(--ink);background:var(--yellow);
  font-family:var(--font-en);font-weight:800;font-size:13px;display:grid;place-items:center;
}
.stopcard{
  flex:1;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:20px;
  padding:15px 18px;box-shadow:0 5px 0 rgba(34,49,77,.12);
  display:grid;gap:7px;
}
.stopcard h3{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stopcard p{font-size:13px;color:var(--ink-soft);line-height:1.6}
.sfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:3px}
.tagno{font-size:11px;color:var(--ink-soft);background:#FFF3D9;border:1.5px solid rgba(34,49,77,.3);border-radius:999px;padding:2px 9px;font-weight:500}
.stop.locked .node{background:#F2EFE5;color:rgba(34,49,77,.4);border-color:rgba(34,49,77,.35);box-shadow:none}
.stop.locked .stopcard{background:#FDFAEF;border-color:rgba(34,49,77,.28);box-shadow:none;color:var(--ink-soft)}
.stop.locked h3{color:var(--ink-soft)}
.stop .node[data-lit="1"]{background:var(--yellow)}
.challenge .node{background:#FFE8CF}
.map-note{max-width:780px;margin:8px auto 0;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.7}
.dailybar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding:12px 18px;
  background:#FFF7DC;border:2px dashed rgba(34,49,77,.3);border-radius:20px;
}
.db-ico{width:46px;height:46px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:14px;background:#FFE27A}
.db-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.db-ico .icon-svg{width:26px;height:26px}
.db-text{flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px}
.db-text b{font-size:16px;font-weight:900}
.db-text span{font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.map-tools{display:flex;justify-content:center;margin-top:18px}
.bank-card{width:min(660px,100%)}
.bank-help{background:#FFF6D6;border:2px dashed rgba(34,49,77,.28);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.65;margin:10px 0 12px}
.bank-help b{display:block;margin-bottom:2px}
.bank-card textarea{
  width:100%;height:clamp(190px,34vh,280px);resize:vertical;border:2px solid rgba(34,49,77,.35);
  border-radius:14px;background:#FFFDF5;padding:11px 12px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);
}
.bank-card textarea:focus{outline:3px solid rgba(47,191,168,.35);outline-offset:1px}
.bank-gradepick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px;font-size:12.5px}
.bank-gradepick label{font-weight:700}
.bank-gradepick select{font:inherit;padding:7px 10px;border:2px solid rgba(34,49,77,.3);border-radius:10px;background:#FFFDF5;color:var(--ink)}
.bank-gradepick span{color:var(--ink-soft)}
.bank-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.bank-actions .hintline{margin-left:auto}
.bank-stat{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.bank-stat span{background:#FFF;border:2px solid rgba(34,49,77,.16);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}
.bank-report{margin-top:12px;border:2px solid rgba(47,191,168,.45);background:#F1FFFB;border-radius:14px;padding:10px 12px}
.bank-rtitle{font-weight:900;font-size:13.5px;margin-bottom:6px}
.bank-rows{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.bank-rows span{padding:3px 10px;border-radius:999px}
.bank-rows .ok{background:#E4F8E2;color:#2F6C28}
.bank-rows .dup{background:#FFF4D2;color:#8A6A12}
.bank-rows .bad{background:#FFE8E2;color:#A63A22}
.bank-rows .tot{background:#EAF4FF;color:#245A86}
.bank-notes{margin-top:8px;font-size:12px;line-height:1.7;color:var(--ink-soft);max-height:110px;overflow:auto}
.bank-ractions{margin-top:9px}
.bank-practice{margin-top:14px;border-top:2px dashed rgba(34,49,77,.18);padding-top:12px}
.bank-practice b{display:block;font-size:13.5px;margin-bottom:2px}
.bank-prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bank-list-head{display:flex;align-items:baseline;gap:10px;margin:16px 0 6px}
.bank-list-head b{font-size:13.5px}
.bank-list{max-height:232px;overflow:auto;border:2px solid rgba(34,49,77,.12);border-radius:12px;background:#FFFDF5;padding:6px 10px}
.bank-item{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed rgba(34,49,77,.12);font-size:12.5px}
.bank-item:last-child{border-bottom:0}
.bank-item .bi-no{flex:none;width:30px;color:var(--ink-soft);font-weight:700}
.bank-item .bi-p{flex:1;font-family:var(--font-en);font-size:15px;line-height:1.35;word-break:break-word}
.bank-item .bi-a{flex:none;color:#3E7D36;font-weight:700}
.bi-more,.bank-empty{padding:8px 2px;font-size:12px;color:var(--ink-soft)}


/* ---------- 绘本导入 ---------- */
.story{
  display:grid;grid-template-columns:1.02fr .98fr;gap:24px;align-items:center;
  background:var(--card);border:2px solid var(--ink);border-radius:28px;
  padding:clamp(18px,2.6vw,28px);box-shadow:var(--shadow-lg);
}
.story-art{position:relative;border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:#EAF7FF}
.story-art .scene-svg{border-radius:0}
.story-art .mascot{position:absolute;left:6px;bottom:-6px;width:112px}
.story-copy{min-width:0}
.story-copy .tag{font-size:12px;font-weight:700;color:var(--orange-deep);background:#FFF0DC;border-radius:999px;padding:4px 10px;display:inline-block}
.story-copy h2{font-size:clamp(23px,3vw,30px);font-weight:900;margin:12px 0 14px;line-height:1.25}
.story-line{margin-bottom:14px;padding-left:14px;border-left:3px solid rgba(34,49,77,.18)}
.story-en{font-family:var(--font-en);font-size:19px;line-height:1.45;font-weight:600}
.story-zh{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.6}
.secret{
  background:#FFF6D6;border:2px dashed rgba(34,49,77,.32);border-radius:16px;
  padding:12px 14px;font-size:13px;line-height:1.65;margin:16px 0 20px;
}
.secret b{color:var(--orange-deep);font-size:12px;display:block;margin-bottom:2px}
.story-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- 答题 ---------- */
.play{max-width:1080px;margin:0 auto;padding:10px clamp(12px,3vw,30px) 40px;min-height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:center}
.play-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 14px;flex-wrap:wrap}
.combo{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  color:#8A5A00;background:#FFF0C2;border:2px solid #E0A800;border-radius:999px;padding:4px 12px;
}
.quiz-card{
  position:relative;display:grid;grid-template-columns:1.02fr .98fr;
  background:var(--card);border:2px solid var(--ink);border-radius:28px;
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.scene-box{position:relative;background:#EAF7FF;border-right:2px dashed rgba(34,49,77,.22);min-height:300px}
.scene-svg{width:100%;height:100%;object-fit:cover;border:0}
.scene-svg svg{width:100%;height:100%}
.mascot-mini{position:absolute;left:8px;bottom:2px;width:96px;pointer-events:none}
.speakbtn{
  position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:700;padding:8px 13px;border-radius:999px;
  border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 rgba(34,49,77,.2);cursor:pointer;color:var(--ink)
}
.speakbtn:hover{background:#FFEED0}
.speakbtn .icon-svg{width:18px;height:18px}
.qbox{padding:clamp(18px,2.4vw,30px);display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
.qzh{
  align-self:flex-start;font-size:12px;font-weight:500;color:var(--ink-soft);
  background:#F4EFE6;border-radius:999px;padding:4px 11px;
}
.qline{
  font-family:var(--font-en);font-size:clamp(23px,3.2vw,32px);line-height:1.45;font-weight:600;
  word-break:break-word;
}
.qline .blank{
  display:inline-block;min-width:2.1em;padding:1px 7px;margin:0 2px;
  border-bottom:3px solid var(--orange);background:#FFF7DE;border-radius:8px;
  color:var(--orange-deep);text-align:center;font-weight:800;line-height:1.2;
  transition:background .2s,color .2s;
}
.qline .blank.filled{background:#DFF3D4;border-bottom-color:#3E8B3A;color:#2F6B2B}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:4px}
.opt{
  display:flex;align-items:center;gap:9px;justify-content:center;
  font-family:var(--font-en);font-size:clamp(17px,2vw,21px);font-weight:600;
  padding:13px 12px;border:2px solid var(--ink);border-radius:16px;background:#fff;
  box-shadow:0 4px 0 rgba(34,49,77,.16);cursor:pointer;color:var(--ink);
  transition:transform .12s,box-shadow .12s,background .12s;
  min-width:0;text-align:center;
}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:hover{background:#FFF6DC;transform:translateY(-2px)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(34,49,77,.16)}
.opt:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.opt.correct{background:#DFF4D3;border-color:#3E7D36;box-shadow:0 4px 0 #3E7D36}
.opt.wrong{background:#FFE4E0;border-color:#D9534F;color:#A33C38;opacity:.55;text-decoration:line-through;pointer-events:none;animation:shake .4s ease}
.opt.dim{opacity:.45}
.opt .key{
  width:24px;height:24px;flex:none;border-radius:50%;background:#FFF1C9;border:1.5px solid rgba(34,49,77,.3);
  display:grid;place-items:center;font-family:var(--font-en);font-size:13px;font-weight:800
}
.chiprow{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.chip{
  font-family:var(--font-en);font-size:19px;font-weight:700;padding:10px 16px;
  border:2px solid var(--ink);border-radius:13px;background:#FFFDF4;
  box-shadow:0 4px 0 rgba(34,49,77,.16);cursor:pointer;color:var(--ink);
}
.chip:hover{background:#FFF3CF;transform:translateY(-2px)}
.chip:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.chip.wrong{opacity:.4;text-decoration:line-through;pointer-events:none}
.chip.right{background:#DFF4D3;border-color:#3E7D36}
.feedback{
  border:2px solid;border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.65;
  display:flex;gap:10px;align-items:flex-start;
}
.feedback.ok{background:#EAF7E3;border-color:#3E7D36}
.feedback.no{background:#FFF2DE;border-color:#D99A2B}
.feedback .fbicon{width:22px;height:22px;flex:none;margin-top:1px}
.feedback .fbtitle{font-weight:700;margin-bottom:2px}
.feedback.ok .fbtitle{color:#2F6B2B}
.feedback.no .fbtitle{color:#9A6410}

/* ---------- 新题型 ---------- */
.orderzone{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:66px;
  padding:10px 12px;border:2px dashed rgba(34,49,77,.26);border-radius:16px;background:#FFFDF5;
}
.orderzone .chip{font-size:15px;padding:8px 13px;background:#FFF;cursor:pointer}
.orderph{font-size:13px;color:var(--ink-soft)}
.orderacts{display:flex;gap:10px;margin-top:8px}
.spellrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.spellinput{
  flex:1;min-width:170px;font-family:var(--font-en);font-size:22px;font-weight:700;
  padding:9px 14px;border:2px solid var(--ink);border-radius:14px;background:#FFFDF5;
  color:var(--ink);outline:none;box-shadow:0 4px 0 rgba(34,49,77,.12);
}
.spellinput:focus{border-color:var(--orange);box-shadow:0 4px 0 rgba(34,49,77,.2)}
.spellhint{margin-top:10px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.spellhint b{color:var(--orange-deep);font-family:var(--font-en)}
.listenbtn{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  font-family:var(--font-body);font-size:17px;font-weight:800;color:var(--ink);
  padding:14px 22px;border-radius:999px;border:2px solid var(--ink);background:#FFE9A8;
  box-shadow:0 5px 0 rgba(34,49,77,.2);
}
.listenbtn:hover{background:#FFDE86;transform:translateY(-2px)}
.listenbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(34,49,77,.2)}
.listenbtn svg{width:22px;height:22px}
.nextrow{display:flex;justify-content:flex-end;gap:10px;margin-top:2px}
.hintline{font-size:12px;color:var(--ink-soft);line-height:1.6}

/* ---------- 结算 ---------- */
.center-wrap{min-height:calc(100vh - 66px);display:flex;flex-direction:column;justify-content:center}
.result{
  width:100%;max-width:720px;margin:0 auto;background:var(--card);border:2px solid var(--ink);
  border-radius:30px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow-lg);text-align:center;position:relative;overflow:hidden
}
.result::before,.result::after{
  content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,201,60,.18);
}
.result::before{left:-46px;top:-46px}
.result::after{right:-46px;bottom:-46px;background:rgba(89,198,234,.18)}
.res-stars{display:flex;justify-content:center;gap:10px;margin:4px 0 8px;position:relative}
.res-stars .star{width:44px;height:44px}
.res-title{font-size:clamp(26px,4vw,36px);font-weight:900;position:relative}
.res-sub{font-size:14px;color:var(--ink-soft);margin-top:8px;line-height:1.7;position:relative}
.wrongbox{text-align:left;margin:24px 0 4px;background:#FFFBEF;border:2px dashed rgba(34,49,77,.26);border-radius:18px;padding:14px 16px;position:relative}
.wrongbox h3{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.wrongitem{font-size:13px;line-height:1.65;padding:8px 0;border-bottom:1px dashed rgba(34,49,77,.16)}
.wrongitem:last-child{border-bottom:0}
.wrongitem .we{font-family:var(--font-en);font-size:15px;font-weight:600}
.wrongitem .wt{color:var(--ink-soft)}
.wrongitem b{color:#3E7D36}
.result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px;position:relative}
.res-mascot{width:110px;margin:0 auto -4px;position:relative}

/* ---------- 错题本 ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(34,49,77,.42);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.book-card{
  width:min(720px,100%);max-height:84vh;overflow:auto;background:var(--card);
  border:2px solid var(--ink);border-radius:24px;box-shadow:0 14px 0 rgba(34,49,77,.2);
  padding:22px clamp(16px,3vw,26px);
}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.book-head h2{font-size:20px;font-weight:900}
.book-empty{text-align:center;padding:34px 10px;color:var(--ink-soft);font-size:14px;line-height:1.8}
.book-item{border-bottom:1px dashed rgba(34,49,77,.18);padding:12px 0;font-size:13px;line-height:1.65}
.book-item:last-child{border-bottom:0}
.book-item .we{font-family:var(--font-en);font-size:17px;font-weight:600;display:block}
.book-item .wa{color:#3E7D36;font-weight:700}
.book-item .wt{color:var(--ink-soft)}
.book-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.book-foot button{background:none;border:none;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:0}

/* ---------- 动效 ---------- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes bob-slow{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-18px) rotate(-3deg)}70%{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}
}
@keyframes float-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-ring{0%,100%{box-shadow:0 5px 0 rgba(34,49,77,.15),0 0 0 0 rgba(255,138,61,.35)}50%{box-shadow:0 5px 0 rgba(34,49,77,.15),0 0 0 12px rgba(255,138,61,0)}}
.mascot .m-inner{transform-origin:50% 100%}
.mascot.idle .m-inner{animation:bob 3.4s ease-in-out infinite}
.mascot.happy .m-inner{animation:jump .55s ease-out}
.mascot.sad .m-inner{animation:shake .45s ease-in-out}
.mascot.talk .m-inner{animation:bob 1.1s ease-in-out infinite}
.fade-in{animation:float-in .4s ease both}
.confetti{
  position:absolute;top:28%;left:50%;width:9px;height:15px;border-radius:3px;
  pointer-events:none;z-index:6;animation:fall 1.05s cubic-bezier(.25,.7,.3,1) forwards;
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:6px}
  .hero-art{height:216px;order:-1;margin-bottom:8px}
  .hero-art .mascot{width:144px;bottom:22px}
  .hero-art .art-book{width:196px;height:46px}
  .tile{width:50px;height:50px;font-size:24px;border-radius:13px}
  .tile.a{left:4%;top:14px}
  .tile.b{right:10%;top:2px}
  .tile.c{right:1%;bottom:64px}
  .grade-grid{grid-template-columns:repeat(2,1fr)}
  .story{grid-template-columns:1fr}
  .quiz-card{grid-template-columns:1fr}
  .scene-box{border-right:0;border-bottom:2px dashed rgba(34,49,77,.22);min-height:0;aspect-ratio:16/9}
  .qbox{padding:18px}
  .mb-stars{align-items:flex-start}
}
@media (max-width:560px){
  .title{font-size:clamp(34px,10vw,48px)}
  .title .t1::after{height:14px;bottom:4px}
  .grade-grid{gap:12px}
  .gcard{padding:14px 13px}
  .gname{font-size:18px}
  .gblurb{font-size:12px;min-height:3.4em}
  .gbadge{width:40px;height:40px;border-radius:12px}
  .options{grid-template-columns:1fr}
  .stop{gap:10px}
  .node{width:56px;height:56px;border-width:2px}
  .node .icon-svg{width:27px;height:27px}
  .trail::before{left:27px}
  .stopcard{padding:12px 14px}
  .stopcard h3{font-size:16px}
  .stopcard p{font-size:12px}
  .hero-note{font-size:11px}
  .mascot-mini{width:78px}
  .res-stars .star{width:34px;height:34px}
}
@media (max-width:600px){
  .maphead{display:grid;grid-template-columns:52px 1fr auto;gap:10px 12px;padding:14px 16px;align-items:center}
  .mb-badge{width:52px;height:52px;border-radius:14px;grid-column:1;grid-row:1}
  .mb-badge .icon-svg{width:28px;height:28px}
  .mb-text{grid-column:2;grid-row:1}
  .mb-name{font-size:19px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:1.2}
  .mb-tag{line-height:1.55}
  .maphead .btn.sm{grid-column:3;grid-row:1;justify-self:end;padding:8px 12px;font-size:13px}
  .mb-stars{grid-column:1/-1;grid-row:2;flex-direction:row;justify-content:space-between;align-items:center;width:100%;padding-top:8px;border-top:1px dashed rgba(34,49,77,.2)}
  .dailybar{display:grid;grid-template-columns:46px 1fr;gap:8px 12px;padding:12px 14px;align-items:center}
  .db-ico{grid-column:1;grid-row:1}
  .db-text{grid-column:2;grid-row:1;min-width:0}
  .db-acts{grid-column:2;grid-row:2;justify-self:start;margin-left:0}
  .db-acts .btn{padding:8px 14px;font-size:13px}
}
@media (max-width:360px){
  .bar-title{white-space:nowrap;line-height:1.2;font-size:14px;letter-spacing:-.3px}
  .topbar-in{min-height:60px;padding-top:6px;padding-bottom:6px}
  .wrap{padding-left:12px;padding-right:12px}
  .gcard{padding:12px}
  .grade-grid{gap:10px}
  .gprog{flex-direction:column;align-items:flex-start;gap:2px;font-size:11px}
}
@media (hover:none){
  .btn:hover,.iconbtn:hover,.speakbtn:hover{background:var(--card);color:var(--ink)}
  .btn.primary:hover{background:var(--yellow);color:var(--ink)}
  .gcard:hover{transform:rotate(var(--tilt,0deg));box-shadow:var(--shadow)}
  .opt:hover{background:#fff;transform:none;box-shadow:0 4px 0 rgba(34,49,77,.16)}
  .chip:hover{background:#FFFDF4;transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

const LS_KEY = "wordisland_v1";
const DEFAULT_DATA = {coins:0, progress:{}, wrongs:[], last:null, mute:false, daily:null, extra:{}};
let data = loadData();
const S = {view:"home", gid:"g3", li:0, run:null, book:false, workshop:false, workshopGid:"g3"};
const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
let toastTimer = null;

function loadData(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    const d = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_DATA)), raw);
    if(d.progress && Array.isArray(d.progress.g5) && d.progress.g5.length && d.progress.g5.length < 11){
      const old = d.progress.g5.slice();
      d.progress.g5 = old.length === 5
        ? old.slice(0,4).concat([null,null,null,null,null,null], [old[4] > 0 ? old[4] : null])
        : old.concat(Array(11 - old.length).fill(null));
    }
    if(d.progress && typeof d.progress === "object" && !Array.isArray(d.progress)){
      Object.keys(d.progress).forEach(function(k){
        const a = d.progress[k];
        if(Array.isArray(a)) d.progress[k] = a.map(function(v){ return (typeof v === "number" && v > 0) ? v : null; });
      });
    }
    /* 内置题库：本地没有该年级扩展题时自动装入，换设备/换链接也能看到 */
    if(typeof BUILTIN_BANK !== "undefined"){
      if(!d.extra || typeof d.extra !== "object" || Array.isArray(d.extra)) d.extra = {};
      Object.keys(BUILTIN_BANK).forEach(function(k){
        const mine = Array.isArray(d.extra[k]) ? d.extra[k] : [];
        const key = function(q){ return String(q.p || "").replace(/_{2,}/g, "___") + "|" + String(q.a || ""); };
        const has = {};
        mine.forEach(function(q){ has[key(q)] = 1; });
        const add = BUILTIN_BANK[k].filter(function(q){ return !has[key(q)]; });
        d.extra[k] = mine.concat(add);
      });
    }
    return d;
  }catch(e){
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}
function saveData(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
}
function gradeById(id){ return GRADES.find(function(g){ return g.id === id; }) || GRADES[0]; }
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/"/g,"&quot;");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function toast(msg){
  if(!toastEl) return;
  toastEl.textContent = msg;
  toastEl.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.style.opacity = "0"; }, 2200);
}
function icon(name, cls){
  const clsName = "icon-svg" + (cls ? " " + cls : "");
  return '<svg class="' + clsName + '" viewBox="0 0 100 100" aria-hidden="true"><use href="#ic-' + name + '" xlink:href="#ic-' + name + '"></use></svg>';
}
function starSVG(on){
  return '<svg class="star ' + (on ? "on" : "off") + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-star" xlink:href="#ic-star"></use></svg>';
}
function starRow(n, total){
  total = total || 3;
  let out = "";
  for(let i = 0; i < total; i++) out += starSVG(i < (n || 0));
  return '<span class="star-row" aria-label="' + (n || 0) + ' 颗星">' + out + "</span>";
}
function gradeStars(gid){
  const g = gradeById(gid);
  const arr = data.progress[gid] || [];
  return arr.slice(0, g.levels.length).reduce(function(a, b){ return a + (b || 0); }, 0);
}
function doneLevels(g){
  const arr = data.progress[g.id] || [];
  let n = 0;
  for(let i = 0; i < g.levels.length; i++) if((arr[i] || 0) > 0) n++;
  return n;
}
function extraQs(gid){
  return (data.extra && data.extra[gid]) || [];
}
function allQuestions(g){
  const list = [];
  g.levels.forEach(function(lv){ lv.qs.forEach(function(q){ list.push(q); }); });
  return list.concat(extraQs(g.id));
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function hashStr(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function seededRng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

let actx = null;
function ensureCtx(){
  if(data.mute) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!actx) actx = new AC();
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function beep(freq, dur, type, vol, delay){
  const ctx = ensureCtx();
  if(!ctx) return;
  dur = dur || 0.12; vol = vol || 0.16; delay = delay || 0;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type || "triangle";
  o.frequency.value = freq;
  const t = ctx.currentTime + delay;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function sfx(kind){
  if(data.mute) return;
  if(kind === "ok"){ [523.25, 659.25, 783.99].forEach(function(f, i){ beep(f, 0.13, "triangle", 0.15, i * 0.075); }); }
  else if(kind === "no"){ beep(240, 0.1, "square", 0.07); beep(176, 0.16, "square", 0.07, 0.1); }
  else { beep(620, 0.055, "sine", 0.06); }
}

let TTS_VOICES = [];
function refreshVoices(){
  try{ TTS_VOICES = (window.speechSynthesis && window.speechSynthesis.getVoices()) || []; }
  catch(e){ TTS_VOICES = []; }
  return TTS_VOICES;
}
function voiceScore(v){
  if(!v) return -9999;
  const n = String(v.name || "");
  const lang = String(v.lang || "");
  if(!/^en/i.test(lang)) return -9999;
  let sc = 0;
  if(/^en[-_]us/i.test(lang)) sc += 6;
  else if(/^en[-_]gb/i.test(lang)) sc += 3;
  if(/natural|neural/i.test(n)) sc += 70;
  if(/online/i.test(n)) sc += 45;
  if(/google/i.test(n)) sc += 30;
  if(/aria|jenny|ava|allison|samantha|karen|serena|michelle|tessa|moira|sonia|libby|emma|olivia/i.test(n)) sc += 20;
  if(/guy|davis|brian|eric|andrew|christopher|ryan|tony/i.test(n)) sc += 9;
  if(/desktop|sapi|compact|espeak|festival|pico|lili|huihui|tingting|meijia/i.test(n)) sc -= 45;
  if(!v.localService) sc += 4;
  return sc;
}
function pickVoice(){
  const list = TTS_VOICES.length ? TTS_VOICES : refreshVoices();
  if(!list || !list.length) return null;
  let best = null, bestScore = -9998;
  list.forEach(function(v){
    const sc = voiceScore(v);
    if(sc > bestScore){ bestScore = sc; best = v; }
  });
  return bestScore > -9998 ? best : null;
}
function pickCnVoice(){
  const list = TTS_VOICES.length ? TTS_VOICES : refreshVoices();
  if(!list || !list.length) return null;
  let best = null, bestScore = -9998;
  list.forEach(function(v){
    const n = String(v.name || "");
    if(!/^zh/i.test(String(v.lang || ""))) return;
    let sc = 0;
    if(/natural|neural|online/i.test(n)) sc += 20;
    if(/xiaoxiao|xiaoyi|yunjian|female/i.test(n)) sc += 6;
    if(sc > bestScore){ bestScore = sc; best = v; }
  });
  return bestScore > -9998 ? best : null;
}
function fallbackSpeak(text, onend){
  if(!("speechSynthesis" in window)){ toast("这个浏览器暂时不能朗读，可以看文字哦"); return; }
  const seq = clipSeq;
  const en = !/[\u4e00-\u9fa5]/.test(text);
  function go(){
    if(seq !== clipSeq) return;
    if(!TTS_VOICES.length) refreshVoices();
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = en ? pickVoice() : pickCnVoice();
      u.lang = (v && v.lang) ? v.lang : (en ? "en-US" : "zh-CN");
      if(v){ try{ u.voice = v; }catch(e2){} }
      u.rate = en ? 0.9 : 0.95;
      u.pitch = 1;
      u.volume = 1;
      if(onend) u.onend = onend;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  if(!TTS_VOICES.length){
    refreshVoices();
    if(!TTS_VOICES.length){ setTimeout(go, 220); return; }
  }
  go();
}

let mascotURL = null;
function mascotSrc(){
  if(mascotURL) return mascotURL;
  try{
    const bin = atob(MASCOT_B64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    mascotURL = URL.createObjectURL(new Blob([bytes], {type:"image/webp"}));
  }catch(e){
    mascotURL = "data:image/webp;base64," + MASCOT_B64;
  }
  return mascotURL;
}
function warmMascot(){
  try{
    const img = new Image();
    img.src = mascotSrc();
    if(img.decode){ img.decode().catch(function(){}); }
  }catch(e){}
}
function mascotSVG(){
  return '<img class="m-inner" alt="" src="' + mascotSrc() + '" decoding="sync">';
}

/* ---------- 场景插画 ---------- */
function sceneSVG(art, bg){
  const list = (art || []).slice(0, 3);
  const n = list.length;
  let pos;
  if(n === 0) pos = [];
  else if(n === 1) pos = [{x:106, y:40, w:108}];
  else if(n === 2) pos = [{x:44, y:50, w:90}, {x:186, y:50, w:90}];
  else pos = [{x:22, y:56, w:82}, {x:116, y:50, w:88}, {x:214, y:56, w:82}];
  const indoor = bg === "room";
  const rainy = list.indexOf("rain") >= 0;
  const sunny = list.indexOf("sun") >= 0;
  let items = "";
  list.forEach(function(name, i){
    const p = pos[i];
    items += '<ellipse cx="' + (p.x + p.w / 2) + '" cy="' + (p.y + p.w + 4) + '" rx="' + (p.w / 2.6) + '" ry="9" fill="' + (indoor ? "#C08A50" : "#5EA846") + '" opacity=".35"/>';
    items += '<use href="#ic-' + name + '" xlink:href="#ic-' + name + '" x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.w + '"></use>';
  });
  let backdrop;
  if(indoor){
    backdrop = '<rect width="320" height="180" fill="#FFF0D6"/>' +
      '<rect y="136" width="320" height="44" fill="#F1C98F"/>' +
      '<path d="M0 136h320" stroke="#DDAA68" stroke-width="5"/>' +
      '<rect x="248" y="16" width="48" height="36" rx="5" fill="#DDF3FF" stroke="#22314D" stroke-width="3"/>' +
      '<path d="M272 16v36M248 34h48" stroke="#22314D" stroke-width="2" opacity=".4"/>';
  }else{
    backdrop = '<rect width="320" height="180" fill="' + (rainy ? "#DDEBF2" : "#E9F7FF") + '"/>' +
      (!sunny && !rainy ? '<circle cx="278" cy="32" r="24" fill="#FFE08A" opacity=".55"/><circle cx="278" cy="32" r="17" fill="#FFD35C"/>' : "") +
      '<g fill="#FFFFFF" opacity=".92">' +
        '<ellipse cx="46" cy="34" rx="26" ry="13"/><ellipse cx="68" cy="38" rx="18" ry="10"/>' +
        '<ellipse cx="210" cy="56" rx="18" ry="9"/>' +
      '</g>' +
      '<path d="M0 140C70 116 120 146 190 130 240 118 290 136 320 126V180H0Z" fill="#BFE8A3"/>' +
      '<rect y="154" width="320" height="26" fill="#8FD97A"/>' +
      '<g fill="#FFFDF6"><circle cx="28" cy="166" r="3"/><circle cx="158" cy="168" r="3"/><circle cx="300" cy="166" r="3"/></g>';
  }
  return '<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="场景插画">' +
    backdrop + items + "</svg>";
}

/* ---------- 答题 ---------- */
function promptHTML(q, r){
  if(q.t === "spell"){
    let html = esc(String(q.p || "").replace(/_{2,}/g, "___").replace(/\([^()]*[\u4e00-\u9fa5][^()]*\)$/, "").trim());
    if(html.indexOf("___") >= 0){
      const shown = r.locked ? esc(q.a) : "?";
      html = html.replace("___", '<span class="blank ' + (r.locked ? "filled" : "") + '">' + shown + "</span>");
    }
    const first = String(q.hint || q.a || "?")[0];
    return html + '<div class="spellhint">首字母 <b>' + esc(first.toUpperCase()) + "</b> · 共 " + String(q.a || "").length + " 个字母</div>";
  }
  if(q.t === "order"){
    const seq = r.orderSeq || [];
    let slot = "";
    if(seq.length){
      slot = seq.map(function(id, pos){
        const it = (r.orderPool || []).find(function(x){ return x.id === id; });
        return '<button class="chip" data-act="orderdrop" data-pos="' + pos + '">' + esc(it ? it.w : "") + "</button>";
      }).join("");
    }else{
      slot = '<span class="orderph">点下面的词卡，按顺序放进来</span>';
    }
    return '<div class="orderzone">' + slot + "</div>";
  }
  if(q.t === "listen"){
    return '<button class="listenbtn" data-act="playword">' + icon("speaker") + " 播放单词</button>";
  }
  let html = esc(String(q.p || "").replace(/_{2,}/g, "___"));
  if(html.indexOf("___") >= 0){
    const filled = r.filled ? esc(r.filled) : "?";
    html = html.replace("___", '<span class="blank ' + (r.filled ? "filled" : "") + '">' + filled + "</span>");
    html = html.split("___").join('<span class="blank"></span>');
  }
  return html;
}
function optionsHTML(q, r){
  if(q.t === "spell"){
    return '<div class="spellrow">' +
      '<input class="spellinput" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="在这里输入英文单词" value="' + escAttr(r.typed || "") + '">' +
      '<button class="btn primary" data-act="spellsubmit">提交</button></div>';
  }
  if(q.t === "order"){
    const pool = (r.orderPool || []).filter(function(it){ return !it.used; });
    let chips = pool.map(function(it){
      return '<button class="chip" data-act="orderword" data-id="' + it.id + '">' + esc(it.w) + "</button>";
    }).join("");
    const done = (r.orderSeq || []).length === (q.words || []).length;
    return '<div class="chiprow">' + chips + "</div>" +
      '<div class="orderacts">' +
        '<button class="btn sm" data-act="orderreset">重来</button>' +
        '<button class="btn primary" data-act="ordersubmit"' + (done && !r.locked ? "" : " disabled") + ">提交</button>" +
      "</div>";
  }
  if(q.t === "fill"){
    let chips = "";
    r.opts.forEach(function(v){
      let cls = "chip";
      if(r.picked.indexOf(v) >= 0) cls += " wrong";
      if(r.locked && v === q.a) cls += " right";
      chips += '<button class="' + cls + '" data-act="chip" data-val="' + escAttr(v) + '">' + esc(v) + "</button>";
    });
    return '<div class="chiprow">' + chips + "</div>";
  }
  const keys = ["A", "B", "C", "D"];
  let opts = "";
  r.opts.forEach(function(v, i){
    let cls = "opt";
    if(r.picked.indexOf(v) >= 0) cls += " wrong";
    if(r.locked && v === q.a) cls += " correct";
    else if(r.locked) cls += " dim";
    opts += '<button class="' + cls + '" data-act="opt" data-val="' + escAttr(v) + '">' +
      '<span class="key">' + keys[i] + "</span><span>" + esc(v) + "</span></button>";
  });
  return '<div class="options">' + opts + "</div>";
}
function feedbackHTML(r){
  if(!r.feedback) return "";
  const ok = r.feedback.ok;
  let html = '<div class="feedback ' + (ok ? "ok" : "no") + '"><span class="fbicon">' + icon(ok ? "check" : "cross") + "</span>" +
    '<div><div class="fbtitle">' + r.feedback.title + "</div><div>" + r.feedback.text + "</div></div></div>";
  if(ok){
    const last = r.i >= r.qs.length - 1;
    html += '<div class="nextrow"><button class="btn primary nextbtn" data-act="next">' + (last ? "看看结果" : "下一题") + "</button></div>";
  }
  return html;
}

    .replace(/\s+/g, " ")
    .trim();
}

function importBank(){
  const g = gradeById(S.workshopGid || S.gid);
  const el = document.getElementById("bankInput");
  if(!el) return;
  const text = String(el.value || "").trim();
  if(!text){ toast("先把题目 JSON 粘贴进来"); return; }

  let raw;
  try{ raw = JSON.parse(text); }
  catch(err){ toast("JSON 解析失败：" + err.message); return; }
  if(raw && !Array.isArray(raw)){
    if(Array.isArray(raw.items)) raw = raw.items;
    else if(Array.isArray(raw.questions)) raw = raw.questions;
    else { toast("要粘一个题目数组，例如 [ {…}, {…} ]"); return; }
  }
  if(!Array.isArray(raw) || !raw.length){ toast("题目数组是空的"); return; }

  const batch = raw.slice(0, BANK_MAX_BATCH);
  const overBatch = raw.length - batch.length;
  const existing = extraQs(g.id).slice();
  const seen = new Set();
  g.levels.forEach(function(lv){ lv.qs.forEach(function(q){ seen.add(bankKey(q.p)); }); });
  existing.forEach(function(q){ seen.add(bankKey(q.p)); });

  const iconNames = Array.prototype.map.call(document.querySelectorAll('symbol[id^="ic-"]'), function(n){ return n.id.slice(3); });
  const qs = [];
  const notes = [];
  const dupNames = [];
  let dup = 0, bad = 0;

  batch.forEach(function(item, i){
    const no = "第 " + (i + 1) + " 条";
    if(!item || typeof item !== "object" || Array.isArray(item)){
      bad++;
      if(notes.length < 10) notes.push(no + "：不是题目对象，已跳过");
      return;
    }
    const p = String(item.p || "").trim().replace(/_{2,}/g, "___");
    if(!p){
      bad++;
      if(notes.length < 10) notes.push(no + "：缺少 p 题干，已跳过");
      return;
    }
    const key = bankKey(p);
    if(seen.has(key)){
      dup++;
      if(dupNames.length < 6) dupNames.push(p.length > 46 ? p.slice(0, 46) + "…" : p);
      return;
    }
    const a = String(item.a || "").trim();
    const o = Array.isArray(item.o) ? item.o.map(function(x){ return String(x).trim(); }).filter(Boolean) : [];
    const isFill = item.t === "fill" || p.indexOf("___") >= 0;
    if(!a){
      bad++;
      if(notes.length < 10) notes.push(no + "：缺少 a 正确答案，已跳过");
      return;
    }
    if(!o.length){
      bad++;
      if(notes.length < 10) notes.push(no + "：缺少 o 选项数组，已跳过");
      return;
    }
    if(new Set(o).size !== o.length){
      bad++;
      if(notes.length < 10) notes.push(no + "：o 选项里有重复项，已跳过");
      return;
    }
    if(o.indexOf(a) < 0){
      bad++;
      if(notes.length < 10) notes.push(no + "：答案 a 不在 o 选项里，已跳过");
      return;
    }
    if(!isFill && o.length !== 4){
      bad++;
      if(notes.length < 10) notes.push(no + "：选择题需要正好 4 个选项（现在 " + o.length + " 个），已跳过");
      return;
    }
    if(isFill && (o.length < 2 || o.length > 6)){
      bad++;
      if(notes.length < 10) notes.push(no + "：填空题选项请给 2–6 个（现在 " + o.length + " 个），已跳过");
      return;
    }
    const q = {p:p, zh:String(item.zh || "").trim(), a:a, o:o.slice(0, 6), tip:String(item.tip || "记住这个表达。").trim()};
    if(isFill) q.t = "fill";
    if(Array.isArray(item.art)){
      q.art = item.art.map(String).filter(function(x){ return iconNames.indexOf(x) >= 0; }).slice(0, 3);
    }
    seen.add(key);
    qs.push(q);
  });

  const room = Math.max(0, BANK_MAX_TOTAL - existing.length);
  const kept = qs.slice(0, room);
  const over = overBatch + (qs.length - kept.length);

  let total = existing.length;
  if(kept.length){
    if(!data.extra) data.extra = {};
    data.extra[g.id] = existing.concat(kept);
    saveData();
    total = data.extra[g.id].length;
  }
  if(dupNames.length) notes.push("重复已跳过：" + dupNames.join("；") + (dup > dupNames.length ? " 等 " + dup + " 道" : ""));
  if(over) notes.push("超出上限的 " + over + " 道没有收进来（单次 500 道上限，单年级共 2000 道上限）");

  S.bankNew = kept;
  S.bankReport = {added: kept.length, dup: dup, bad: bad, over: over, total: total, notes: notes.slice(0, 12)};
  if(kept.length && el) el.value = "";
  render();

  if(kept.length){
    toast("新增 " + kept.length + " 道" + (dup ? "，跳过重复 " + dup + " 道" : "") + (bad ? "，" + bad + " 道格式无效" : "") + "，本题库共 " + total + " 道");
  }else{
    toast("没有新题：" + (dup ? "重复 " + dup + " 道" : "") + (bad ? (dup ? "、" : "") + "格式无效 " + bad + " 道" : "") + (over ? (dup || bad ? "、" : "") + "超上限 " + over + " 道" : ""));
  }
}

function exportBank(){
  const g = gradeById(S.workshopGid || S.gid);
  const list = extraQs(g.id);
  if(!list.length){ toast("题库是空的，没有可导出的题"); return; }
  const blob = new Blob([JSON.stringify(list, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "英语小冒险-扩展题库-" + g.name + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  toast("已导出 " + list.length + " 道题");
}


/* ---------- 关卡与状态 ---------- */
function levelOf(g, li){
  if(li < g.levels.length) return g.levels[li];
  const picked = g.levels.map(function(lv){ return shuffle(lv.qs)[0]; });
  const all = [];
  g.levels.forEach(function(lv){ lv.qs.forEach(function(q){ all.push(q); }); });
  const extra = shuffle(all.filter(function(q){ return picked.indexOf(q) < 0; })).slice(0, 2);
  const total = picked.length + extra.length;
  return {
    name:"复习大挑战", icon:"trophy", tag:"综合复习",
    story:[{en:total + " questions from all " + g.levels.length + " levels.",zh:"全 " + g.levels.length + " 关的题目混在一起，一共 " + total + " 道。"},
           {en:"Take a deep breath. You can do it!",zh:"深呼吸，你可以的！"}],
    secret:"先看清句子里的时间词和主语，再决定用哪个词。",
    qs:picked.concat(extra)
  };
}
function openLevel(li){
  S.li = li;
  S.level = levelOf(gradeById(S.gid), li);
  S.view = "story";
  render();
  scrollTop();
}
function loadQuestion(){
  const r = S.run;
  const q = r.qs[r.i];
  r.opts = q.o ? shuffle(q.o.slice()) : [];
  r.picked = [];
  r.filled = "";
  r.locked = false;
  r.attempted = false;
  r.feedback = null;
  r.typed = "";
  r.orderSeq = [];
  r.orderPool = (q.t === "order") ? shuffle((q.words || []).map(function(w, i){ return {id: i, w: w, used: false}; })) : [];
}
function beginRun(){
  stopSpeech();
  const lv = S.level;
  S.run = {
    gid:S.gid, li:S.li, level:lv,
    qs:lv.qs.map(function(q){ return Object.assign({}, q); }),
    i:0, correct:0, streak:0, wrongs:[], coins:0, stars:0,
    daily:!!lv.daily, bonus:!!lv.bonus, practice:!!lv.practice
  };
  loadQuestion();
  S.view = "play";
  render();
  scrollTop();
}
function currentQ(){ return S.run.qs[S.run.i]; }
function addWrong(q){
  const g = gradeById(S.gid);
  const rec = {g:S.gid, gname:g.name, p:q.p, a:q.a, tip:q.tip};
  if(!S.run.wrongs.some(function(w){ return w.p === q.p && w.a === q.a; })) S.run.wrongs.push(rec);
  if(!data.wrongs.some(function(w){ return w.p === q.p && w.a === q.a; })){
    data.wrongs.unshift(rec);
    if(data.wrongs.length > 60) data.wrongs.pop();
    saveData();
  }
}
function winAnswer(q){
  const r = S.run;
  r.locked = true;
  r.filled = q.a;
  const gain = r.attempted ? 6 : 12;
  r.coins += gain;
  if(!r.attempted){ r.correct++; r.streak++; } else { r.streak = 0; }
  data.coins += gain;
  saveData();
  r.feedback = {ok:true, title:"答对啦！+" + gain + " 金币", text:q.tip};
  sfx("ok");
  burstConfetti();
  speak(questionSpeech(q));
  render();
  const btn = document.querySelector('[data-act="next"]');
  if(btn) btn.focus({preventScroll:true});
}
function failAnswer(q){
  const r = S.run;
  r.attempted = true;
  r.streak = 0;
  r.feedback = {ok:false, title:"再想一想…", text:q.tip};
  addWrong(q);
  sfx("no");
  render();
}
function normAns(v){
  return String(v || "").toLowerCase().replace(/[\u2019\u2018]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,;:]+/g, "");
}
function choose(val){
  const r = S.run;
  if(!r || r.locked) return;
  const q = currentQ();
  if(val === q.a) winAnswer(q);
  else { r.picked.push(val); failAnswer(q); }
}
function submitSpell(){
  const r = S.run;
  if(!r || r.locked) return;
  const q = currentQ();
  const v = normAns(r.typed);
  if(!v){ toast("先把单词打出来"); return; }
  if(v === normAns(q.a)) winAnswer(q);
  else failAnswer(q);
}
function orderWord(id){
  const r = S.run;
  if(!r || r.locked) return;
  const it = (r.orderPool || []).find(function(x){ return x.id === id; });
  if(!it || it.used) return;
  it.used = true;
  r.orderSeq.push(id);
  render();
}
function orderDrop(pos){
  const r = S.run;
  if(!r || r.locked) return;
  const id = r.orderSeq.splice(pos, 1)[0];
  const it = (r.orderPool || []).find(function(x){ return x.id === id; });
  if(it) it.used = false;
  render();
}
function orderReset(){
  const r = S.run;
  if(!r || r.locked) return;
  r.orderSeq = [];
  (r.orderPool || []).forEach(function(it){ it.used = false; });
  render();
}
function submitOrder(){
  const r = S.run;
  if(!r || r.locked) return;
  const q = currentQ();
  const words = r.orderSeq.map(function(id){
    const it = r.orderPool.find(function(x){ return x.id === id; });
    return it ? it.w : "";
  });
  if(words.length < (q.words || []).length){ toast("先把所有词卡都用上"); return; }
  if(normAns(words.join(" ")) === normAns(q.a)) winAnswer(q);
  else failAnswer(q);
}
function nextQ(){
  const r = S.run;
  if(r.i < r.qs.length - 1){
    r.i++;
    loadQuestion();
    render();
    scrollTop();
  }else{
    finishRun();
  }
}
function finishRun(){
  const r = S.run;
  const total = r.qs.length;
  r.stars = r.correct >= total ? 3 : (r.correct >= total - 1 ? 2 : 1);
  const g = gradeById(S.gid);
  if(r.daily){
    const today = todayKey();
    if(!data.daily || data.daily.date !== today) data.daily = {date:today, byGid:{}};
    if(!data.daily.byGid) data.daily.byGid = {};
    const prev = data.daily.byGid[S.gid];
    if(!prev || r.correct > (prev.score || 0)){
      data.daily.byGid[S.gid] = {score:r.correct, total:total};
    }
  }else if(!r.bonus && !r.practice){
    const arr = data.progress[g.id] || [];
    arr[S.li] = Math.max((arr[S.li] > 0 ? arr[S.li] : 0), r.stars > 0 ? r.stars : 1);
    data.progress[g.id] = arr;
    data.last = {gid:S.gid, li:S.li};
  }
  saveData();
  S.view = "result";
  render();
  scrollTop();
}
function burstConfetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const host = document.querySelector(".quiz-card");
  if(!host) return;
  const colors = ["#FFC93C","#FF8A3D","#2FBFA8","#59C6EA","#FF8FA8","#9C8BF2"];
  for(let i = 0; i < 16; i++){
    const s = document.createElement("span");
    s.className = "confetti";
    s.style.background = colors[i % colors.length];
    s.style.left = (30 + Math.random() * 40) + "%";
    s.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    s.style.setProperty("--dy", (70 + Math.random() * 130) + "px");
    s.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
    s.style.animationDelay = (Math.random() * 0.12) + "s";
    host.appendChild(s);
    setTimeout(function(){ s.remove(); }, 1400);
  }
}
function scrollTop(){
  try{ window.scrollTo({top:0, behavior:"auto"}); }catch(e){ window.scrollTo(0,0); }
}
function render(){
  let html = "";
  if(S.view === "home") html = viewHome();
  else if(S.view === "map") html = viewMap();
  else if(S.view === "story") html = viewStory();
  else if(S.view === "play") html = viewPlay();
  else if(S.view === "result") html = viewResult();
  else html = viewHome();
  app.innerHTML = html + (S.book ? viewBook() : "") + (S.workshop ? viewBank() : "");
  syncSound();
  const spellInput = document.querySelector(".spellinput");
  if(spellInput){
    spellInput.addEventListener("input", function(ev){ S.run.typed = ev.target.value; });
    spellInput.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); submitSpell(); }
    });
  }
}

/* ---------- 交互 ---------- */
function goMap(gid){
  stopSpeech();
  S.gid = gid;
  S.book = false;
  S.view = "map";
  render();
  scrollTop();
}
function handleClick(e){
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act;
  if(act === "noclick") return;
  if(act !== "opt" && act !== "chip" && act !== "next") sfx("click");
  switch(act){
    case "grade":
      goMap(t.dataset.gid);
      break;
    case "resume":
      goMap(data.last ? data.last.gid : "g3");
      break;
    case "backhome":
      stopSpeech();
      S.book = false;
      S.view = "home";
      render();
      scrollTop();
      break;
    case "backmap":
      stopSpeech();
      if(S.view === "play" && !confirm("离开这一关？本关进度还不会保存。")) return;
      S.book = false;
      S.view = "map";
      S.run = null;
      render();
      scrollTop();
      break;
    case "start":
      openLevel(Number(t.dataset.li));
      break;
    case "begin":
      beginRun();
      break;
    case "opt":
    case "chip":
      choose(t.dataset.val);
      break;
    case "spellsubmit":
      submitSpell();
      break;
    case "orderword":
      orderWord(Number(t.dataset.id));
      break;
    case "orderdrop":
      orderDrop(Number(t.dataset.pos));
      break;
    case "orderreset":
      orderReset();
      break;
    case "ordersubmit":
      submitOrder();
      break;
    case "playword":
      speak(currentQ().a);
      break;
    case "next":
      nextQ();
      break;
    case "retry":
      beginRun();
      break;
    case "nextlevel":
      if(S.li < gradeById(S.gid).levels.length) openLevel(S.li + 1);
      break;
    case "daily":
      openDaily();
      break;
    case "bonus":
      openBonus();
      break;
    case "workshop":
      S.workshop = true;
      S.workshopGid = S.gid;
      render();
      break;
    case "closeworkshop":
      S.workshop = false;
      render();
      break;
    case "samplebank":{
      const el = document.getElementById("bankInput");
      if(el) el.value = JSON.stringify(bankSample(), null, 2);
      break;
    }
    case "savebank":
      importBank();
      break;
    case "exportbank":
      exportBank();
      break;
    case "practice":
      S.gid = gradeById(S.workshopGid || S.gid).id;
      openBankPractice(Number(t.dataset.n || 10));
      break;
    case "practiceall":
      S.gid = gradeById(S.workshopGid || S.gid).id;
      openBankPractice(0);
      break;
    case "practicenew":{
      const list = (S.bankNew || []).slice(0, 20);
      if(!list.length){ toast("上次导入没有新题"); break; }
      startBankPractice(list, "新题速刷 · " + list.length + " 题", list.length);
      break;
    }
    case "practiceagain":
      openBankPractice(S.practiceCount || 10);
      break;
    case "clearbank":
      if(confirm("确定清空本题库的扩展题吗？")){
        data.extra[gradeById(S.workshopGid || S.gid).id] = [];
        saveData();
        render();
        toast("已清空本题库");
      }
      break;
    case "book":
      S.book = true;
      render();
      break;
    case "closebook":
      S.book = false;
      render();
      break;
    case "clearbook":
      if(confirm("确定清空错题本吗？")){
        data.wrongs = [];
        saveData();
        render();
        toast("错题本已清空");
      }
      break;
    case "speak":
      if(S.run) speak(questionSpeech(currentQ()));
      break;
    case "speakstory":
      speakStory();
      break;
    case "reset":
      if(confirm("确定清空这台设备上的全部进度、金币和错题吗？题库工坊里加的自定义题会保留。")){
        const keepExtra = JSON.parse(JSON.stringify(data.extra || {}));
        data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        data.extra = keepExtra;
        saveData();
        S.view = "home";
        S.run = null;
        render();
        toast("进度已清空，自定义题库保留");
      }
      break;
  }
}
app.addEventListener("click", handleClick);
document.addEventListener("change", function(e){
  if(e.target && e.target.id === "bankGrade"){
    S.workshopGid = e.target.value;
    S.bankReport = null;
    S.bankNew = null;
    render();
  }
});

/* ---------- 声音开关 ---------- */
function mountSound(){
  if(document.getElementById("soundBtn")) return;
  const b = document.createElement("button");
  b.id = "soundBtn";
  b.className = "sound-toggle";
  b.type = "button";
  b.setAttribute("role", "switch");
  b.setAttribute("aria-label", "声音开关");
  b.addEventListener("click", function(){
    data.mute = !data.mute;
    saveData();
    syncSound();
    if(!data.mute){ sfx("click"); }
  });
  document.body.appendChild(b);
  syncSound();
}
function syncSound(){
  if(data.mute) stopSpeech();
  const b = document.getElementById("soundBtn");
  if(!b) return;
  b.setAttribute("aria-checked", String(!data.mute));
  b.innerHTML = icon(data.mute ? "mute" : "speaker");
  b.title = data.mute ? "声音已关闭" : "声音已开启";
}
mountSound();
warmMascot();
refreshVoices();
render();
if("speechSynthesis" in window){
  try{
    window.speechSynthesis.addEventListener("voiceschanged", function(){ refreshVoices(); });
    window.speechSynthesis.onvoiceschanged = function(){ refreshVoices(); };
  }catch(e){}
}
</script>

<script>
(function(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      // 空闲后把全部音频批量拉一遍，交给 SW 缓存，实现断网可玩
      setTimeout(function(){
        if(!navigator.onLine) return;
        var urls = [];
        [typeof CLIPS!=="undefined"?CLIPS:{}, typeof CLIPS_EXTRA!=="undefined"?CLIPS_EXTRA:{},
         typeof CLIPS_WORD!=="undefined"?CLIPS_WORD:{}, typeof CLIPS_BANK!=="undefined"?CLIPS_BANK:{}]
        .forEach(function(m){ for(var k in m){ var v=m[k]; if(typeof v==="string" && v.indexOf("assets/")===0 && urls.indexOf(v)<0) urls.push(v); } });
        var i = 0;
        function next(){
          if(i>=urls.length) return;
          var batch = urls.slice(i, i+6);
          i += 6;
          Promise.all(batch.map(function(u){
            return fetch(u, {cache:"force-cache"}).then(function(r){ return r.blob(); }).catch(function(){});
          })).then(next, next);
        }
        next();
      }, 2500);
      if(reg && reg.update) reg.update().catch(function(){});
    }).catch(function(){});
  });
})();
</script>
